<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mehar Filling Station ERP</title>
  <meta name="theme-color" content="#070B14">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #070B14;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(215, 25, 32, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.10) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .splash-card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(215, 25, 32, 0.15);
      animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .logo-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-pulse {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(215, 25, 32, 0.35) 0%, transparent 70%);
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(0.88); opacity: 0.5; }
      to { transform: scale(1.15); opacity: 1; }
    }
    .logo-img {
      position: relative;
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }
    .badge-vital {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(215, 25, 32, 0.15);
      border: 1px solid rgba(215, 25, 32, 0.35);
      color: #FF5A5F;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 14px;
    }
    .station-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .station-sub {
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      margin-bottom: 28px;
    }
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .spinner-ring {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #D71920;
      border-right-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      color: #CBD5E1;
      font-weight: 500;
    }
    .error-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: 14px;
      font-size: 13px;
      color: #FCA5A5;
    }
    .retry-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #D71920 0%, #B91C1C 100%);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(215, 25, 32, 0.4);
      transition: all 0.2s ease;
    }
    .retry-btn:active {
      transform: scale(0.97);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #64748B;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-container">
      <div class="logo-pulse"></div>
      <img src="icon.png" alt="Mehar Filling Station Logo" class="logo-img">
    </div>
    
    <div class="badge-vital">
      <span>●</span> VITAL PETROLEUM FRANCHISE
    </div>

    <h1 class="station-title">Mehar Filling Station</h1>
    <p class="station-sub">Official Enterprise Management ERP</p>

    <div class="spinner-wrap" id="loaderState">
      <div class="spinner-ring"></div>
      <div class="status-text" id="statusMessage">Connecting to ERP portal...</div>
    </div>

    <div class="error-box" id="errorBox">
      <div id="errorMessage">Unable to connect to live server. Please check your internet connection.</div>
      <button class="retry-btn" onclick="attemptRedirect()">Retry Connection</button>
    </div>

    <div class="footer-note">
      App ID: pro.meharfillingstation.app
    </div>
  </div>

  <script>
    const TARGET_URL = 'https://meharfillingstation.pro/erp';
    let attempts = 0;

    function attemptRedirect() {
      const loader = document.getElementById('loaderState');
      const errBox = document.getElementById('errorBox');
      const statusMsg = document.getElementById('statusMessage');

      loader.style.display = 'flex';
      errBox.style.display = 'none';
      statusMsg.textContent = 'Connecting to ERP portal...';

      if (!navigator.onLine) {
        showError('No internet connection detected. Please connect to Wi-Fi or Mobile Data.');
        return;
      }

      // Check online reachability
      fetch(TARGET_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          statusMsg.textContent = 'Launching ERP System...';
          setTimeout(() => {
            window.location.replace(TARGET_URL);
          }, 400);
        })
        .catch(() => {
          // If fetch fails in some webview environments, still attempt direct navigation
          attempts++;
          if (attempts <= 2) {
            window.location.replace(TARGET_URL);
          } else {
            showError('Server connection timed out. Please check your connection.');
          }
        });
    }

    function showError(msg) {
      document.getElementById('loaderState').style.display = 'none';
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('errorMessage').textContent = msg;
    }

    window.addEventListener('online', attemptRedirect);

    // Initial redirect attempt after brief branding presentation
    setTimeout(attemptRedirect, 800);
  </script>
</body>
</html>
