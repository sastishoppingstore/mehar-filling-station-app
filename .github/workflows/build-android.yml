name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Android App Dependencies & Sync Capacitor
        working-directory: android-app
        run: |
          npm install
          npx cap sync android

      - name: Set Executable Permissions on Gradle Wrapper
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew

      - name: Build Android Debug APK
        working-directory: android-app/android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mehar-Filling-Station-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
